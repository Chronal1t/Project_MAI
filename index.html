<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Менеджер Задач</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Мой Менеджер Задач</h1>

    <div class="form-container">
        <h3>Добавить задачу</h3>
        <input type="text" id="title" placeholder="Название задачи" required>
        <input type="number" id="priority" placeholder="Приоритет (1-5)" min="1" max="5" required>
        <input type="date" id="deadline">
        <button onclick="addTask()">Добавить</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Название</th>
                <th>Приоритет</th>
                <th>Срок</th>
                <th>Статус</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="taskTableBody"></tbody>
    </table>

    <script>
        async function loadTasks() {
            const response = await fetch('/api/tasks');
            const tasks = await response.json();
            const tbody = document.getElementById('taskTableBody');
            tbody.innerHTML = '';

            if (tasks.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Нет задач</td></tr>';
                return;
            }

            tasks.forEach(task => {
                tbody.innerHTML += `
                    <tr>
                        <td>${task.id}</td>
                        <td>${task.title}</td>
                        <td>${task.priority}</td>
                        <td>${task.deadline}</td>
                        <td>${task.status}</td>
                        <td><button class="btn-del" onclick="deleteTask(${task.id})">Удалить</button></td>
                    </tr>
                `;
            });
        }

        async function addTask() {
            const title = document.getElementById('title').value;
            const priority = document.getElementById('priority').value;
            const deadline = document.getElementById('deadline').value;

            if (!title || !priority) { alert("Заполните название и приоритет"); return; }

            const formData = new URLSearchParams();
            formData.append('title', title);
            formData.append('priority', priority);
            formData.append('deadline', deadline);

            const response = await fetch('/api/tasks', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            });

            if (response.ok) {
                document.getElementById('title').value = '';
                document.getElementById('priority').value = '';
                document.getElementById('deadline').value = '';
                loadTasks();
            }
        }

        async function deleteTask(id) {
            if (!confirm('Удалить задачу?')) return;
            const response = await fetch('/api/tasks/' + id, { method: 'DELETE' });
            if (response.ok) loadTasks();
        }

        window.onload = loadTasks;
    </script>
</body>
</html>
